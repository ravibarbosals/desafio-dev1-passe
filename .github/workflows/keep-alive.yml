name: Keep-alive da demo

# O /health faz ping no banco: mantém o Supabase ativo (pausa após 7 dias sem uso) e acorda a API no Render
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-24.04
    steps:
      - name: GET /health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 30 --retry-all-errors --max-time 90 https://desafio-dev1-passe.onrender.com/health
